<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POLYGON RUSH</title>
  <link rel="stylesheet" href="game.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e1f; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #29e7ff;
      font: italic 700 4vmin 'Arial Narrow', Impact, sans-serif; letter-spacing: .2em; background: #0b0e1f; z-index: 50; }
    #boot.err { color: #ff2a4f; font-size: 2vmin; white-space: pre-wrap; padding: 4vmin; letter-spacing: 0; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="boot">CHARGEMENT…</div>
  <script type="module" src="game.js"></script>
</body>
</html>
